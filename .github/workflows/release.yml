name: Release

on:
  push:
    tags:
      - "*-v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive plugin metadata
        id: plugin
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          name="${tag%-v*}"
          version="${tag##*-v}"

          if [[ -z "$name" || -z "$version" || "$name" == "$tag" ]]; then
            echo "Tag must match {name}-v{version}; got: $tag" >&2
            exit 1
          fi

          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install aarch64 Linux linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build plugin
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release -p "${{ steps.plugin.outputs.name }}" --target "${{ matrix.target }}"

      - name: Package binary and checksum
        shell: bash
        run: |
          name="${{ steps.plugin.outputs.name }}"
          target="${{ matrix.target }}"
          asset="${name}-${target}"
          binary="target/${target}/release/${name}"

          mkdir -p dist
          cp "$binary" "dist/$asset"
          chmod +x "dist/$asset"

          cd dist
          : > SHA256SUMS
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" >> SHA256SUMS
          else
            shasum -a 256 "$asset" >> SHA256SUMS
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.plugin.outputs.name }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets

          find artifacts -type f ! -name SHA256SUMS -exec cp {} release-assets/ \;
          find artifacts -type f -name SHA256SUMS -exec cat {} \; | sort > release-assets/SHA256SUMS

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
