[package]
name = "commit"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "aish commit plugin: AI commit message from the staged diff"

[[bin]]
name = "commit"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
